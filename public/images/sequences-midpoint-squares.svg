<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" font-family="system-ui, sans-serif" font-size="16" fill="#2b2622">
  <title>A square with a second square drawn by joining the midpoints of its sides, and a third square inside that one. Each new square has half the area of the one around it: 64, then 32, then 16.</title>
  <rect x="20" y="20" width="190" height="190" fill="#fbeee6" stroke="#b4461a" stroke-width="3" />
  <polygon points="115,20 210,115 115,210 20,115" fill="#f3cdb6" stroke="#b4461a" stroke-width="3" />
  <rect x="67.5" y="67.5" width="95" height="95" fill="#e9a988" stroke="#b4461a" stroke-width="3" />
  <g font-weight="700">
    <text x="250" y="70">Outer square: area 64</text>
    <text x="250" y="110">Middle square: area 32</text>
    <text x="250" y="150">Inner square: area 16</text>
  </g>
  <text x="250" y="190">Each area is half of the last.</text>
</svg>
