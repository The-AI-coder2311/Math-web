<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 210" font-family="system-ui, sans-serif" font-size="17" fill="#2b2622">
  <title>An isosceles triangle with two sides of 13 and a base of 10. A dashed helper line from the top to the base has height 12 and cuts the base into 5 and 5, making two right triangles.</title>
  <polygon points="140,170 340,170 240,20" fill="#fbeee6" stroke="#b4461a" stroke-width="3" />
  <line x1="240" y1="20" x2="240" y2="170" stroke="#2b2622" stroke-width="2" stroke-dasharray="5 5" />
  <polyline points="240,156 254,156 254,170" fill="none" stroke="#2b2622" stroke-width="2" />
  <g font-weight="700">
    <text x="166" y="92">13</text>
    <text x="298" y="92">13</text>
    <text x="246" y="112">12</text>
    <text x="186" y="194">5</text>
    <text x="286" y="194">5</text>
  </g>
</svg>
