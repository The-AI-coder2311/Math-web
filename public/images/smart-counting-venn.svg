<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 250" font-family="system-ui, sans-serif" font-size="17" fill="#2b2622">
  <title>Two overlapping circles inside a box of 30 students: 10 in soccer only, 8 in both, 7 in band only, and 5 in neither</title>
  <rect x="8" y="8" width="464" height="234" fill="#ffffff" stroke="#6b625a" stroke-width="2" rx="6" />
  <text x="22" y="34" font-weight="700">30 students</text>
  <circle cx="185" cy="130" r="88" fill="#fbeee6" fill-opacity="0.75" stroke="#b4461a" stroke-width="3" />
  <circle cx="295" cy="130" r="88" fill="#fbeee6" fill-opacity="0.75" stroke="#b4461a" stroke-width="3" />
  <g text-anchor="middle" font-weight="700">
    <text x="165" y="92" font-size="15">Soccer: 18</text>
    <text x="315" y="92" font-size="15">Band: 15</text>
    <text x="145" y="138" font-size="24">10</text>
    <text x="240" y="138" font-size="24">8</text>
    <text x="335" y="138" font-size="24">7</text>
    <text x="440" y="228" font-size="20">5</text>
  </g>
  <text x="240" y="160" text-anchor="middle" font-size="14">both</text>
  <text x="400" y="228" text-anchor="end" font-size="14">neither:</text>
</svg>
