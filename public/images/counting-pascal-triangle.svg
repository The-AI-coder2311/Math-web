<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" font-family="system-ui, sans-serif" font-size="19" fill="#2b2622">
  <title>Pascal's triangle with rows 0 through 5. The rows are 1; 1 1; 1 2 1; 1 3 3 1; 1 4 6 4 1; and 1 5 10 10 5 1. Each number is the sum of the two numbers above it, such as 4 plus 6 making 10.</title>
  <g text-anchor="middle">
    <text x="240" y="30">1</text>
    <text x="210" y="65">1</text><text x="270" y="65">1</text>
    <text x="180" y="100">1</text><text x="240" y="100">2</text><text x="300" y="100">1</text>
    <text x="150" y="135">1</text><text x="210" y="135">3</text><text x="270" y="135">3</text><text x="330" y="135">1</text>
    <text x="120" y="170">1</text><text x="180" y="170">4</text><text x="240" y="170" font-weight="700" fill="#b4461a">6</text><text x="300" y="170" font-weight="700" fill="#b4461a">4</text><text x="360" y="170">1</text>
    <text x="90" y="205">1</text><text x="150" y="205">5</text><text x="210" y="205">10</text><text x="270" y="205" font-weight="700" fill="#b4461a">10</text><text x="330" y="205">5</text><text x="390" y="205">1</text>
  </g>
</svg>
