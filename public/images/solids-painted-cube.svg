<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 210" font-family="system-ui, sans-serif" font-size="16" fill="#2b2622">
  <title>A cube cut into 27 small cubes. Corner cubes have 3 painted faces and there are 8. Edge cubes have 2 painted faces and there are 12. Face center cubes have 1 painted face and there are 6. The 1 cube in the very middle has no paint.</title>
  <!-- A flat drawing of one 3 by 3 face, with the kinds of cube named. -->
  <g stroke="#b4461a" stroke-width="2">
    <g fill="#e9a988">
      <rect x="20" y="20" width="56" height="56" /><rect x="132" y="20" width="56" height="56" />
      <rect x="20" y="132" width="56" height="56" /><rect x="132" y="132" width="56" height="56" />
    </g>
    <g fill="#fbeee6">
      <rect x="76" y="20" width="56" height="56" /><rect x="20" y="76" width="56" height="56" />
      <rect x="132" y="76" width="56" height="56" /><rect x="76" y="132" width="56" height="56" />
    </g>
    <rect x="76" y="76" width="56" height="56" fill="#ffffff" />
  </g>
  <g text-anchor="middle" font-weight="700">
    <text x="48" y="54">3</text><text x="160" y="54">3</text><text x="48" y="166">3</text><text x="160" y="166">3</text>
    <text x="104" y="54">2</text><text x="48" y="110">2</text><text x="160" y="110">2</text><text x="104" y="166">2</text>
    <text x="104" y="110">1</text>
  </g>
  <text x="215" y="40" font-weight="700">Painted faces on one layer's cubes</text>
  <text x="215" y="76">Corners: 3 painted faces, 8 cubes</text>
  <text x="215" y="106">Edges: 2 painted faces, 12 cubes</text>
  <text x="215" y="136">Face centers: 1 painted face, 6 cubes</text>
  <text x="215" y="166">Very middle: no paint, 1 cube</text>
</svg>
