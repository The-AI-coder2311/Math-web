<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 150" font-family="system-ui, sans-serif" font-size="16" fill="#2b2622">
  <title>Squares of dots growing by an L shape: 1 dot, then adding 3 makes 4, adding 5 makes 9, and adding 7 makes 16</title>
  <g fill="#b4461a">
    <circle cx="30" cy="30" r="8" />
  </g>
  <g fill="#b4461a"><circle cx="110" cy="30" r="8" /></g>
  <g fill="#ffffff" stroke="#b4461a" stroke-width="3">
    <circle cx="136" cy="30" r="7" /><circle cx="110" cy="56" r="7" /><circle cx="136" cy="56" r="7" />
  </g>
  <g fill="#b4461a">
    <circle cx="210" cy="30" r="8" /><circle cx="236" cy="30" r="8" /><circle cx="210" cy="56" r="8" /><circle cx="236" cy="56" r="8" />
  </g>
  <g fill="#ffffff" stroke="#b4461a" stroke-width="3">
    <circle cx="262" cy="30" r="7" /><circle cx="262" cy="56" r="7" /><circle cx="210" cy="82" r="7" /><circle cx="236" cy="82" r="7" /><circle cx="262" cy="82" r="7" />
  </g>
  <g fill="#b4461a">
    <circle cx="340" cy="30" r="8" /><circle cx="366" cy="30" r="8" /><circle cx="392" cy="30" r="8" />
    <circle cx="340" cy="56" r="8" /><circle cx="366" cy="56" r="8" /><circle cx="392" cy="56" r="8" />
    <circle cx="340" cy="82" r="8" /><circle cx="366" cy="82" r="8" /><circle cx="392" cy="82" r="8" />
  </g>
  <g fill="#ffffff" stroke="#b4461a" stroke-width="3">
    <circle cx="418" cy="30" r="7" /><circle cx="418" cy="56" r="7" /><circle cx="418" cy="82" r="7" />
    <circle cx="340" cy="108" r="7" /><circle cx="366" cy="108" r="7" /><circle cx="392" cy="108" r="7" /><circle cx="418" cy="108" r="7" />
  </g>
  <g font-weight="700">
    <text x="22" y="140">1</text>
    <text x="96" y="140">1 + 3 = 4</text>
    <text x="196" y="140">4 + 5 = 9</text>
    <text x="330" y="140">9 + 7 = 16</text>
  </g>
</svg>
