<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 170" font-family="system-ui, sans-serif" font-size="17" fill="#2b2622">
  <title>Five equal boxes holding 4 cups each: 2 boxes of juice make 8 cups, and 3 boxes of water make 12 cups</title>
  <g font-weight="700">
    <text x="16" y="55">Juice</text>
    <text x="16" y="125">Water</text>
  </g>
  <g fill="#fbeee6" stroke="#b4461a" stroke-width="2">
    <rect x="90" y="24" width="60" height="50" />
    <rect x="150" y="24" width="60" height="50" />
    <rect x="90" y="94" width="60" height="50" />
    <rect x="150" y="94" width="60" height="50" />
    <rect x="210" y="94" width="60" height="50" />
  </g>
  <g text-anchor="middle" font-weight="700">
    <text x="120" y="55">4</text>
    <text x="180" y="55">4</text>
    <text x="120" y="125">4</text>
    <text x="180" y="125">4</text>
    <text x="240" y="125">4</text>
  </g>
  <text x="225" y="55">= 8 cups</text>
  <text x="285" y="125">= 12 cups</text>
</svg>
