<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 210" font-family="system-ui, sans-serif" font-size="16" fill="#2b2622">
  <title>A circle with center O and radius 5. A tangent line touches the circle at T, and runs to an outside point P, 12 units from T. The radius OT meets the tangent at a right angle, so triangle OTP is a right triangle with hypotenuse OP equal to 13.</title>
  <circle cx="110" cy="110" r="70" fill="#ffffff" stroke="#b4461a" stroke-width="3" />
  <polygon points="110,110 110,40 278,40" fill="#fbeee6" stroke="#b4461a" stroke-width="2.5" />
  <polyline points="110,54 124,54 124,40" fill="none" stroke="#2b2622" stroke-width="2" />
  <circle cx="110" cy="110" r="3.5" fill="#2b2622" />
  <g font-weight="700">
    <text x="92" y="126">O</text>
    <text x="102" y="30">T</text>
    <text x="286" y="44">P</text>
    <text x="90" y="80">5</text>
    <text x="190" y="32">12</text>
    <text x="205" y="92">13</text>
  </g>
</svg>
