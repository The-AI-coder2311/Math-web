<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 190" font-family="system-ui, sans-serif" font-size="16" fill="#2b2622">
  <title>The same L shape shown two ways. On the left, it is split into a 5 by 2 rectangle and an 8 by 4 rectangle. On the right, it is an 8 by 6 rectangle with a 3 by 2 corner removed.</title>
  <!-- 20 px per unit. L shape: 8 wide, 6 tall, top right corner 3 by 2 removed. -->
  <g transform="translate(40 20)">
    <polygon points="0,0 100,0 100,40 160,40 160,120 0,120" fill="#fbeee6" stroke="#b4461a" stroke-width="3" />
    <line x1="0" y1="40" x2="100" y2="40" stroke="#2b2622" stroke-width="2" stroke-dasharray="5 5" />
    <text x="50" y="26" text-anchor="middle" font-weight="700">5 by 2</text>
    <text x="80" y="86" text-anchor="middle" font-weight="700">8 by 4</text>
  </g>
  <g transform="translate(280 20)">
    <rect x="100" y="0" width="60" height="40" fill="#ffffff" stroke="#6b625a" stroke-width="2" stroke-dasharray="5 5" />
    <polygon points="0,0 100,0 100,40 160,40 160,120 0,120" fill="#fbeee6" stroke="#b4461a" stroke-width="3" />
    <text x="130" y="26" text-anchor="middle" font-weight="700" font-size="14">3 by 2</text>
    <text x="80" y="86" text-anchor="middle" font-weight="700">8 by 6, minus</text>
  </g>
  <text x="120" y="170" text-anchor="middle" font-weight="700">Split: 10 + 32 = 42</text>
  <text x="360" y="170" text-anchor="middle" font-weight="700">Subtract: 48 − 6 = 42</text>
</svg>
