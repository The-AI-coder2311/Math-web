<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" font-family="system-ui, sans-serif" font-size="17" fill="#2b2622">
  <title>A triangle with base 8 and height 5 drawn inside a rectangle 8 by 5. The triangle fills exactly half of the rectangle.</title>
  <rect x="60" y="20" width="320" height="150" fill="#ffffff" stroke="#6b625a" stroke-width="2" stroke-dasharray="7 6" />
  <polygon points="60,170 380,170 180,20" fill="#fbeee6" stroke="#b4461a" stroke-width="3" />
  <line x1="180" y1="20" x2="180" y2="170" stroke="#2b2622" stroke-width="2" stroke-dasharray="4 4" />
  <polyline points="180,156 194,156 194,170" fill="none" stroke="#2b2622" stroke-width="2" />
  <text x="198" y="108" font-weight="700">height 5</text>
  <text x="170" y="200" font-weight="700">base 8</text>
</svg>
