<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" font-family="system-ui, sans-serif" font-size="16" fill="#2b2622">
  <title>A tilted triangle with corners (0, 0), (5, 1) and (2, 4), drawn inside a box 5 wide and 4 tall. The box has area 20. Three right triangles in the corners of the box have areas 2.5, 4.5 and 4. Subtracting leaves an area of 9 for the tilted triangle.</title>
  <rect x="30" y="50" width="150" height="120" fill="#ffffff" stroke="#6b625a" stroke-width="2" stroke-dasharray="6 5" />
  <polygon points="30,170 180,170 180,140" fill="#f3cdb6" stroke="#6b625a" stroke-width="1" />
  <polygon points="180,140 180,50 90,50" fill="#f3cdb6" stroke="#6b625a" stroke-width="1" />
  <polygon points="30,170 30,50 90,50" fill="#f3cdb6" stroke="#6b625a" stroke-width="1" />
  <polygon points="30,170 180,140 90,50" fill="#fbeee6" stroke="#b4461a" stroke-width="3" />
  <g font-weight="700" font-size="14">
    <text x="24" y="190">(0, 0)</text>
    <text x="186" y="145">(5, 1)</text>
    <text x="72" y="42">(2, 4)</text>
    <text x="120" y="165">2.5</text>
    <text x="150" y="85">4.5</text>
    <text x="42" y="95">4</text>
    <text x="96" y="120" fill="#b4461a">9</text>
  </g>
  <text x="255" y="80" font-weight="700">Box: 5 × 4 = 20</text>
  <text x="255" y="110">Corners: 2.5 + 4.5 + 4 = 11</text>
  <text x="255" y="140" font-weight="700">Triangle: 20 − 11 = 9</text>
</svg>
