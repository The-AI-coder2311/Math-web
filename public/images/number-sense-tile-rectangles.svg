<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" font-family="system-ui, sans-serif" font-size="17" fill="#2b2622">
  <title>Three rectangles made from 12 square tiles: 1 by 12, 2 by 6, and 3 by 4</title>
  <defs>
    <pattern id="tile" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#fbeee6" stroke="#b4461a" stroke-width="2" />
    </pattern>
  </defs>
  <g font-weight="700">
    <text x="16" y="42">1 row of 12</text>
    <text x="16" y="102">2 rows of 6</text>
    <text x="16" y="186">3 rows of 4</text>
  </g>
  <rect x="120" y="24" width="288" height="24" fill="url(#tile)" stroke="#b4461a" stroke-width="2" />
  <rect x="120" y="72" width="144" height="48" fill="url(#tile)" stroke="#b4461a" stroke-width="2" />
  <rect x="120" y="144" width="96" height="72" fill="url(#tile)" stroke="#b4461a" stroke-width="2" />
</svg>
