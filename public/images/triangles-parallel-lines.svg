<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 230" font-family="system-ui, sans-serif" font-size="18" fill="#2b2622">
  <title>Two parallel lines crossed by a slanted line. At each crossing, the matching corner measures 70 degrees, and the angle beside it measures 110 degrees.</title>
  <g stroke="#6b625a" stroke-width="3">
    <line x1="30" y1="70" x2="450" y2="70" />
    <line x1="30" y1="165" x2="450" y2="165" />
  </g>
  <line x1="205" y1="215" x2="276" y2="20" stroke="#b4461a" stroke-width="3" />
  <g font-weight="700">
    <text x="274" y="62" fill="#b4461a">70°</text>
    <text x="205" y="62">110°</text>
    <text x="240" y="157" fill="#b4461a">70°</text>
    <text x="170" y="157">110°</text>
  </g>
</svg>
