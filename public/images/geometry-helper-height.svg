<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" font-family="system-ui, sans-serif" font-size="17" fill="#2b2622">
  <title>A triangle whose top is to the right of its base. The base is 6 and the height, drawn as a dashed line outside the triangle down to the extended base line, is 4.</title>
  <!-- Base from x=60 to x=270 (6 units at 35 px). Top is above x=380, height 140 px (4 units at 35 px). -->
  <line x1="270" y1="170" x2="380" y2="170" stroke="#2b2622" stroke-width="2" stroke-dasharray="4 4" />
  <polygon points="60,170 270,170 380,30" fill="#fbeee6" stroke="#b4461a" stroke-width="3" />
  <line x1="380" y1="30" x2="380" y2="170" stroke="#2b2622" stroke-width="2" stroke-dasharray="4 4" />
  <polyline points="366,170 366,156 380,156" fill="none" stroke="#2b2622" stroke-width="2" />
  <text x="388" y="108" font-weight="700">height 4</text>
  <text x="165" y="198" text-anchor="middle" font-weight="700">base 6</text>
</svg>
