<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 220" font-family="system-ui, sans-serif" font-size="16" fill="#2b2622">
  <title>A line on a grid passing through the points (1, 1) and (4, 3). A right triangle shows a run of 3 going across and a rise of 2 going up, so the slope is 2 over 3.</title>
  <g stroke="#d9d0c5" stroke-width="1">
    <line x1="40" y1="30" x2="40" y2="180" /><line x1="70" y1="30" x2="70" y2="180" /><line x1="100" y1="30" x2="100" y2="180" /><line x1="130" y1="30" x2="130" y2="180" /><line x1="160" y1="30" x2="160" y2="180" /><line x1="190" y1="30" x2="190" y2="180" />
    <line x1="40" y1="180" x2="190" y2="180" /><line x1="40" y1="150" x2="190" y2="150" /><line x1="40" y1="120" x2="190" y2="120" /><line x1="40" y1="90" x2="190" y2="90" /><line x1="40" y1="60" x2="190" y2="60" /><line x1="40" y1="30" x2="190" y2="30" />
  </g>
  <g stroke="#2b2622" stroke-width="2">
    <line x1="40" y1="30" x2="40" y2="180" />
    <line x1="40" y1="180" x2="190" y2="180" />
  </g>
  <line x1="40" y1="170" x2="190" y2="70" stroke="#b4461a" stroke-width="3" />
  <polyline points="70,150 160,150 160,90" fill="none" stroke="#2b2622" stroke-width="2" stroke-dasharray="5 5" />
  <circle cx="70" cy="150" r="5" fill="#b4461a" />
  <circle cx="160" cy="90" r="5" fill="#b4461a" />
  <g font-weight="700">
    <text x="44" y="128">(1, 1)</text>
    <text x="120" y="80">(4, 3)</text>
    <text x="96" y="170">run 3</text>
    <text x="166" y="126">rise 2</text>
  </g>
  <text x="230" y="90" font-weight="700">Slope = rise ÷ run</text>
  <text x="230" y="120">It rises 2 for every 3 across,</text>
  <text x="230" y="146">so the slope is 2/3.</text>
</svg>
