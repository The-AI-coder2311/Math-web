week: 6
title: Probability
summary: Find the chance of an event by counting the ways it can happen.
teacherNote: >-
  Every problem here works the same way. Count the outcomes you want, then divide by all the
  equally likely outcomes. For the two-dice problems, a 6-by-6 grid makes counting easy and shows
  why there are 36 outcomes. Give answers as fractions in lowest terms.
problems:
  - question: A standard 6-sided die is rolled. What is the probability of rolling a number greater than 4?
    answer: '$\frac{1}{3}$'
    verify: "fraction(range(1, 6).filter((n) => n > 4).length, 6)"
    explanation: Only 5 and 6 are greater than 4. That's 2 out of 6 outcomes, and $\frac{2}{6} = \frac{1}{3}$.
  - question: A bag has 3 red, 5 blue, and 2 green marbles. One marble is picked without looking. What is the probability that it's blue?
    answer: '$\frac{1}{2}$'
    verify: "fraction(5, 3 + 5 + 2)"
    explanation: There are $3 + 5 + 2 = 10$ marbles, and 5 are blue. $\frac{5}{10} = \frac{1}{2}$
  - question: Two coins are flipped. What is the probability that both land heads?
    answer: '$\frac{1}{4}$'
    verify: "fraction(product(['H', 'T'], ['H', 'T']).filter(([a, b]) => a === 'H' && b === 'H').length, 4)"
    explanation: The four equally likely outcomes are HH, HT, TH, and TT. Only one of them is two heads.
  - question: Two standard dice are rolled. What is the probability that the numbers add up to 7?
    answer: '$\frac{1}{6}$'
    verify: "fraction(product(range(1, 6), range(1, 6)).filter(([a, b]) => a + b === 7).length, 36)"
    explanation: There are $6 \times 6 = 36$ outcomes. A sum of 7 comes from 1 and 6, 2 and 5, 3 and 4, 4 and 3, 5 and 2, or 6 and 1. That's 6 outcomes, and $\frac{6}{36} = \frac{1}{6}$.
  - question: Cards numbered 1 through 20 are placed in a hat, and one is drawn. What is the probability that the number is prime?
    answer: '$\frac{2}{5}$'
    verify: "fraction(range(1, 20).filter(isPrime).length, 20)"
    explanation: The primes are 2, 3, 5, 7, 11, 13, 17, and 19, so there are 8. $\frac{8}{20} = \frac{2}{5}$
  - question: Two standard dice are rolled and the two numbers are multiplied. What is the probability that the product is even?
    answer: '$\frac{3}{4}$'
    verify: "fraction(product(range(1, 6), range(1, 6)).filter(([a, b]) => (a * b) % 2 === 0).length, 36)"
    explanation: It's easier to count the opposite. The product is odd only if both dice are odd, which happens in $3 \times 3 = 9$ of the 36 outcomes. That leaves $36 - 9 = 27$ even outcomes, and $\frac{27}{36} = \frac{3}{4}$.
