week: 16
title: A Taste of the AMC 10
summary: Six problems that preview Level 3 ideas, for students ready to look past the AMC 8.
teacherNote: >-
  These are harder on purpose. They preview the AMC 10 and Level 3 of the Learning Pathway. Let groups
  pick the problems that interest them. A student who solves even one has done something new. Pair this
  set with the club plan's discussion of what comes after the AMC 8.
problems:
  - question: What is $101^2 - 99^2$? Try to find it without multiplying out either square.
    answer: 400
    verify: "101 * 101 - 99 * 99"
    explanation: >-
      A difference of two squares factors: $a^2 - b^2 = (a + b)(a - b)$. Here that's
      $(101 + 99) \times (101 - 99) = 200 \times 2 = 400$.
  - question: What is the remainder when $3^{100}$ is divided by 5?
    answer: 1
    verify: "range(1, 100).reduce((r) => (r * 3) % 5, 1)"
    explanation: >-
      The remainders of 3, 9, 27, 81, divided by 5, are 3, 4, 2, 1, and then they repeat. Since 100 is
      a multiple of 4, the 100th power lands on the 4th spot of the cycle, which is 1.
  - question: What is the sum of the first 30 odd numbers?
    answer: 900
    verify: "sum(range(1, 59).filter((n) => n % 2 === 1))"
    explanation: >-
      Try small cases: 1 = 1, 1 + 3 = 4, 1 + 3 + 5 = 9. The sum of the first n odd numbers is $n^2$.
      So the first 30 odd numbers add to $30 \times 30 = 900$.
  - question: >-
      In how many ways can you put 6 identical candies into 3 different bags? A bag is allowed to be
      empty.
    answer: 28
    verify: "product(range(0, 6), range(0, 6), range(0, 6)).filter((bags) => sum(bags) === 6).length"
    explanation: >-
      Line up the 6 candies and add 2 dividers to split them into 3 bags. That's 8 objects in a row, and
      you choose which 2 of the 8 spots are dividers: $\frac{8 \times 7}{2} = 28$.
  - question: What is the slope of the line through the points (1, 2) and (4, 11)?
    answer: 3
    verify: "range(-10, 10).find((m) => 2 + m * (4 - 1) === 11)"
    explanation: >-
      Slope is rise over run. The rise is $11 - 2 = 9$, and the run is $4 - 1 = 3$. $9 \div 3 = 3$
  - question: >-
      The equation $x^2 - 7x + 10 = 0$ has two solutions. What is the sum of their squares?
    answer: 29
    verify: "range(-20, 20).filter((x) => x * x - 7 * x + 10 === 0).reduce((total, x) => total + x * x, 0)"
    explanation: >-
      Factor: $x^2 - 7x + 10 = (x - 2)(x - 5)$, so the solutions are 2 and 5. Their squares add to
      $4 + 25 = 29$.
