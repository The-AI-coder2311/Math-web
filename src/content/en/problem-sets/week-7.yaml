week: 7
title: Mini-contest
summary: A 20-minute, 10-problem practice contest that mixes every topic so far.
teacherNote: >-
  Give students 20 minutes with no calculators, working alone. Tell them it's normal not to finish.
  They should skip anything that takes too long and come back later. Keep scores private, and let
  pairs compare answers and fix mistakes before you go over the key.
problems:
  - question: What is the value of $6 + 4 \times 5 - 2$?
    answer: 24
    verify: "6 + 4 * 5 - 2"
    explanation: Multiply first, and then add and subtract from left to right. $6 + 20 - 2 = 24$
  - question: Jordan's four test scores are 78, 85, 90, and 95. What is the average of these scores?
    answer: 87
    verify: "sum([78, 85, 90, 95]) / 4"
    explanation: The scores add up to $78 + 85 + 90 + 95 = 348$. Then divide by the number of tests. $348 \div 4 = 87$
  - question: What is 40% of 150?
    answer: 60
    verify: "(150 * 40) / 100"
    explanation: 10% of 150 is 15, so 40% is four times that. $4 \times 15 = 60$
  - question: How many multiples of 6 are there from 1 to 100?
    answer: 16
    verify: "range(1, 100).filter((n) => n % 6 === 0).length"
    explanation: The largest multiple of 6 that's at most 100 is $6 \times 16 = 96$. So the multiples are 6 times each whole number from 1 to 16.
  - question: A square has an area of 64 square feet. What is its perimeter, in feet?
    answer: 32
    verify: "Math.sqrt(64) * 4"
    explanation: Since $8 \times 8 = 64$, each side is 8 feet. The perimeter is $4 \times 8 = 32$.
  - question: A dinner menu has 3 appetizers, 5 main dishes, and 2 desserts. How many different meals have one of each?
    answer: 30
    verify: "product(range(1, 3), range(1, 5), range(1, 2)).length"
    explanation: There are three choices in a row, so multiply. $3 \times 5 \times 2 = 30$
  - question: A bus travels 60 kilometers in 45 minutes. At the same speed, how many kilometers does it travel in 2 hours?
    answer: 160
    verify: "(60 / 45) * 120"
    explanation: "In 15 minutes, the bus travels $60 \\div 3 = 20$ kilometers. Two hours is $120 \\div 15 = 8$ of these 15-minute blocks, so the bus travels $8 \\times 20 = 160$ kilometers."
  - question: What is the sum of the first 10 odd numbers, $1 + 3 + 5 + \cdots + 19$?
    answer: 100
    verify: "sum(range(1, 19).filter((n) => n % 2 === 1))"
    explanation: Pair the first and last numbers, like $1 + 19 = 20$ and $3 + 17 = 20$. There are 5 pairs. $5 \times 20 = 100$
  - question: A spinner has 8 equal sections numbered 1 through 8. What is the probability of landing on a multiple of 3?
    answer: '$\frac{1}{4}$'
    verify: "fraction(range(1, 8).filter((n) => n % 3 === 0).length, 8)"
    explanation: Only 3 and 6 are multiples of 3. That's 2 of the 8 sections, and $\frac{2}{8} = \frac{1}{4}$.
  - question: What is the smallest whole number greater than 10 that has exactly 3 positive factors?
    answer: 25
    verify: "range(11, 100).find((n) => factors(n).length === 3)"
    explanation: A number has exactly 3 factors only when it's the square of a prime. The squares of primes are 4, 9, 25, and so on, and 25 is the first one greater than 10. Its factors are 1, 5, and 25.
