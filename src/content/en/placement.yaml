# The placement quiz at /pathway/start/. Questions go from Level 1 to Level 3 ideas.
# `level` says which pathway level the question checks. The page recommends a level from
# how many questions at each level a student gets right. Every answer is checked by
# `verify`, like the unit problems.
questions:
  - level: 1
    question: A student has 3 shirts and 4 pairs of pants. An outfit is one shirt and one pair of pants. How many different outfits can the student make?
    choices: ["7", "12", "10", "16"]
    answer: B
    verify: "product(range(1, 3), range(1, 4)).length"
    explanation: Each of the 3 shirts goes with each of the 4 pairs of pants, so multiply. $3 \times 4 = 12$
  - level: 1
    question: A square has an area of 49 square inches. What is its perimeter, in inches?
    choices: ["7", "14", "28", "49"]
    answer: C
    verify: "range(1, 49).find((side) => side * side === 49) * 4"
    explanation: The side length times itself is 49, so each side is 7 inches. A square has 4 equal sides. $4 \times 7 = 28$
  - level: 1
    question: What is the remainder when 100 is divided by 7?
    choices: ["2", "3", "4", "5"]
    answer: A
    verify: "range(0, 6).find((r) => (100 - r) % 7 === 0)"
    explanation: The biggest multiple of 7 that fits in 100 is $7 \times 14 = 98$. That leaves $100 - 98 = 2$.
  - level: 2
    question: The average of four numbers is 15. Three of the numbers are 10, 12, and 20. What is the fourth number?
    choices: ["13", "15", "23", "18"]
    answer: D
    verify: "range(0, 100).find((x) => (10 + 12 + 20 + x) / 4 === 15)"
    explanation: Four numbers with an average of 15 add up to $4 \times 15 = 60$. The three you know add up to $10 + 12 + 20 = 42$, so the fourth is $60 - 42 = 18$.
  - level: 2
    question: A coach picks a team of 3 players from 6 students. The order doesn't matter. How many different teams are possible?
    choices: ["18", "20", "120", "216"]
    answer: B
    verify: "combos(range(1, 6), 3).length"
    explanation: Picking in order gives $6 \times 5 \times 4 = 120$, but each team was counted once for every order of its 3 players, which is $3 \times 2 \times 1 = 6$ times. $120 \div 6 = 20$
  - level: 2
    question: A right triangle has legs of length 9 and 12. How long is its longest side?
    choices: ["13", "17", "15", "21"]
    answer: C
    verify: "range(1, 30).find((c) => c * c === 9 * 9 + 12 * 12)"
    explanation: By the Pythagorean Theorem, the longest side squared is $81 + 144 = 225$, and $15 \times 15 = 225$.
  - level: 3
    question: What is the sum of all the odd numbers from 1 to 39?
    choices: ["380", "420", "800", "400"]
    answer: D
    verify: "sum(range(1, 39).filter((n) => n % 2 === 1))"
    explanation: There are 20 odd numbers from 1 to 39. Pair the first with the last, $1 + 39 = 40$, the second with the second-to-last, and so on. That makes 10 pairs of 40. $10 \times 40 = 400$
  - level: 3
    question: What is the remainder when $2^{20}$ is divided by 7?
    choices: ["4", "2", "1", "6"]
    answer: A
    verify: "range(1, 20).reduce((r) => (r * 2) % 7, 1)"
    explanation: The remainders of 2, 4, 8, 16, and so on, divided by 7, repeat in the cycle 2, 4, 1. Since $20 = 3 \times 6 + 2$, the 20th power lands on the 2nd spot of the cycle, which is 4.
